name: Publish to Chrome Web Store

# 發版:把商店包檔名寫進 .github/chrome-publish.trigger 後推送,即自動上傳+送審。
# 需要四個 repo secrets(取得方式見 docs/CHROME_STORE_SUBMISSION.md 第四步):
#   CWS_EXTENSION_ID / CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN
on:
  push:
    branches: [claude/continue-work-Hp1Na]
    paths: ['.github/chrome-publish.trigger']
  workflow_dispatch:
    inputs:
      zip:
        description: '指定商店包檔名(留空 = 讀 .github/chrome-publish.trigger)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: release
          path: rel

      - name: Pick store package
        id: pick
        run: |
          NAME="${{ github.event.inputs.zip }}"
          [ -z "$NAME" ] && [ -f .github/chrome-publish.trigger ] && NAME=$(grep -v '^#' .github/chrome-publish.trigger | tr -d ' \r\n')
          [ -n "$NAME" ] && ZIP="rel/releases/$NAME" || ZIP=$(ls -1 rel/releases/NHITW_clinic_reader_store_*.zip | sort -V | tail -1)
          [ -f "$ZIP" ] || { echo "::error::store zip not found: $ZIP"; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version: $(unzip -p "$ZIP" manifest.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"

      - name: Check secrets
        id: sec
        env:
          E: ${{ secrets.CWS_EXTENSION_ID }}
          I: ${{ secrets.CWS_CLIENT_ID }}
          S: ${{ secrets.CWS_CLIENT_SECRET }}
          R: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          E=$(printf '%s' "$E" | tr -d '[:space:]'); I=$(printf '%s' "$I" | tr -d '[:space:]'); S=$(printf '%s' "$S" | tr -d '[:space:]'); R=$(printf '%s' "$R" | tr -d '[:space:]')
          echo "::add-mask::$I"; echo "::add-mask::$S"; echo "::add-mask::$R"
          [ -n "$E" ] && [ -n "$I" ] && [ -n "$S" ] && [ -n "$R" ] || { echo "::error::CWS_EXTENSION_ID / CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN 未設定(見 docs/CHROME_STORE_SUBMISSION.md 第四步)"; exit 1; }
          echo "$E" | grep -Eq '^[a-p]{32}$' || { echo "::error::CWS_EXTENSION_ID 格式不對(長度 ${#E})—— 應為 Chrome 商店的 32 碼小寫字母 ID"; exit 1; }
          echo "e=$E" >> "$GITHUB_OUTPUT"; echo "i=$I" >> "$GITHUB_OUTPUT"; echo "s=$S" >> "$GITHUB_OUTPUT"; echo "r=$R" >> "$GITHUB_OUTPUT"

      - name: Get access token
        id: tok
        run: |
          T=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id='${{ steps.sec.outputs.i }}' -d client_secret='${{ steps.sec.outputs.s }}' \
            -d refresh_token='${{ steps.sec.outputs.r }}' -d grant_type=refresh_token \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          [ -n "$T" ] || { echo "::error::取不到 access token —— 請確認 Client ID / Secret / Refresh token 是同一個 OAuth 用戶端、且 refresh token 尚未失效"; exit 1; }
          echo "::add-mask::$T"; echo "t=$T" >> "$GITHUB_OUTPUT"

      - name: Upload package
        run: |
          R=$(curl -sS -X PUT -H "Authorization: Bearer ${{ steps.tok.outputs.t }}" -H "x-goog-api-version: 2" \
            -T "${{ steps.pick.outputs.zip }}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ steps.sec.outputs.e }}")
          echo "$R"
          echo "$R" | grep -q '"uploadState"[[:space:]]*:[[:space:]]*"SUCCESS"' || { echo "::error::upload failed"; exit 1; }

      - name: Publish (submit for review)
        run: |
          R=$(curl -sS -X POST -H "Authorization: Bearer ${{ steps.tok.outputs.t }}" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ steps.sec.outputs.e }}/publish")
          echo "$R"
          echo "$R" | grep -Eq '"status"[[:space:]]*:[[:space:]]*\[[[:space:]]*"(OK|ITEM_PENDING_REVIEW)"' || { echo "::error::publish rejected"; exit 1; }
          echo "✅ 已送審,通過後 Chrome 會自動推送給所有安裝者(未列出模式不變)"
