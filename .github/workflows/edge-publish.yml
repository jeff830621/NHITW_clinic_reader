name: Publish to Edge Add-ons

# 手動觸發(Actions 頁面「Run workflow」,或由發版流程以 API 觸發)。
# 商店包放在 release 分支 releases/NHITW_clinic_reader_store_*.zip,
# 取最新一個上傳並送審;審查備註取自本分支 docs/certification-notes.txt。
# 需要三個 repo secrets:EDGE_PRODUCT_ID / EDGE_CLIENT_ID / EDGE_API_KEY
on:
  # 發版:把要上架的商店包檔名寫進 .github/edge-publish.trigger 後推送,即自動發佈。
  push:
    branches: [claude/continue-work-Hp1Na]
    paths: ['.github/edge-publish.trigger']
  workflow_dispatch:
    inputs:
      zip:
        description: '指定商店包檔名(留空 = 讀 .github/edge-publish.trigger,再空 = release 最新)'
        required: false
        default: ''

env:
  API: https://api.addons.microsoftedge.microsoft.com/v1/products

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # 本分支:workflow + 審查備註
      - uses: actions/checkout@v4                 # release 分支:商店包
        with:
          ref: release
          path: rel

      - name: Pick store package
        id: pick
        run: |
          NAME="${{ github.event.inputs.zip }}"
          [ -z "$NAME" ] && [ -f .github/edge-publish.trigger ] && NAME=$(grep -v '^#' .github/edge-publish.trigger | tr -d ' \r\n')
          if [ -n "$NAME" ]; then
            ZIP="rel/releases/$NAME"
          else
            ZIP=$(ls -1 rel/releases/NHITW_clinic_reader_store_*.zip | sort -V | tail -1)
          fi
          [ -f "$ZIP" ] || { echo "::error::store zip not found: $ZIP"; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version: $(unzip -p "$ZIP" manifest.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          echo "uploading: $ZIP"

      # 貼進 GitHub Secrets 的值常會夾帶換行或空白(第一次執行就是 Product ID
      # 開頭多了一個換行,網址因此壞掉)。這裡一律去除空白後再交給後續步驟,
      # 並檢查 Product ID 是否為 36 碼 GUID。修剪後的值先登記為遮罩,不會出現在 log。
      - name: Check secrets
        id: sec
        env:
          P: ${{ secrets.EDGE_PRODUCT_ID }}
          C: ${{ secrets.EDGE_CLIENT_ID }}
          K: ${{ secrets.EDGE_API_KEY }}
        run: |
          P=$(printf '%s' "$P" | tr -d '[:space:]'); C=$(printf '%s' "$C" | tr -d '[:space:]'); K=$(printf '%s' "$K" | tr -d '[:space:]')
          echo "::add-mask::$P"; echo "::add-mask::$C"; echo "::add-mask::$K"
          [ -n "$P" ] && [ -n "$C" ] && [ -n "$K" ] || { echo "::error::EDGE_PRODUCT_ID / EDGE_CLIENT_ID / EDGE_API_KEY 未設定(見 docs/EDGE_STORE_SUBMISSION.md 第四步)"; exit 1; }
          echo "$P" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' || { echo "::error::EDGE_PRODUCT_ID 格式不對(長度 ${#P})—— 應為 Partner Center 產品頁網址中的 36 碼 GUID,例如 …/products/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/…"; exit 1; }
          echo "$C" | grep -Eq '^[0-9a-fA-F-]{36}$' || echo "::warning::EDGE_CLIENT_ID 長度 ${#C},看起來不像 GUID,請確認"
          echo "p=$P" >> "$GITHUB_OUTPUT"; echo "c=$C" >> "$GITHUB_OUTPUT"; echo "k=$K" >> "$GITHUB_OUTPUT"

      - name: Upload package
        id: upload
        env:
          P: ${{ steps.sec.outputs.p }}
          C: ${{ steps.sec.outputs.c }}
          K: ${{ steps.sec.outputs.k }}
        run: |
          H=$(mktemp)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -D "$H" -X POST \
            -H "Authorization: ApiKey $K" -H "X-ClientID: $C" -H "Content-Type: application/zip" \
            --data-binary "@${{ steps.pick.outputs.zip }}" \
            "$API/$P/submissions/draft/package")
          echo "HTTP $CODE"
          OP=$(grep -i '^Location:' "$H" | tr -d '\r' | awk '{print $2}')
          [ "$CODE" = "202" ] && [ -n "$OP" ] || { echo "::error::upload rejected (HTTP $CODE)"; cat "$H"; exit 1; }
          echo "operation=$OP" >> "$GITHUB_OUTPUT"

      - name: Wait for package processing
        env:
          P: ${{ steps.sec.outputs.p }}
          C: ${{ steps.sec.outputs.c }}
          K: ${{ steps.sec.outputs.k }}
        run: |
          for i in $(seq 1 40); do
            S=$(curl -sS -H "Authorization: ApiKey $K" -H "X-ClientID: $C" \
              "$API/$P/submissions/draft/package/operations/${{ steps.upload.outputs.operation }}")
            echo "$S"
            echo "$S" | grep -qi '"status"[[:space:]]*:[[:space:]]*"Succeeded"' && exit 0
            echo "$S" | grep -qi '"status"[[:space:]]*:[[:space:]]*"Failed"' && { echo "::error::package processing failed"; exit 1; }
            sleep 15
          done
          echo "::error::timed out waiting for package processing"; exit 1

      - name: Publish (submit for certification)
        id: publish
        env:
          P: ${{ steps.sec.outputs.p }}
          C: ${{ steps.sec.outputs.c }}
          K: ${{ steps.sec.outputs.k }}
        run: |
          BODY=$(jq -Rs '{notes: .}' docs/certification-notes.txt)
          H=$(mktemp)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -D "$H" -X POST \
            -H "Authorization: ApiKey $K" -H "X-ClientID: $C" -H "Content-Type: application/json" \
            -d "$BODY" "$API/$P/submissions")
          echo "HTTP $CODE"
          OP=$(grep -i '^Location:' "$H" | tr -d '\r' | awk '{print $2}')
          [ "$CODE" = "202" ] || { echo "::error::publish rejected (HTTP $CODE)"; cat "$H"; exit 1; }
          echo "operation=$OP" >> "$GITHUB_OUTPUT"

      - name: Wait for publish acceptance
        env:
          P: ${{ steps.sec.outputs.p }}
          C: ${{ steps.sec.outputs.c }}
          K: ${{ steps.sec.outputs.k }}
        run: |
          [ -n "${{ steps.publish.outputs.operation }}" ] || { echo "no operation id; submitted"; exit 0; }
          for i in $(seq 1 20); do
            S=$(curl -sS -H "Authorization: ApiKey $K" -H "X-ClientID: $C" \
              "$API/$P/submissions/operations/${{ steps.publish.outputs.operation }}")
            echo "$S"
            echo "$S" | grep -qi '"status"[[:space:]]*:[[:space:]]*"Succeeded"' && { echo "✅ 已送審,通過後 Edge 會自動推送給所有安裝者"; exit 0; }
            echo "$S" | grep -qi '"status"[[:space:]]*:[[:space:]]*"Failed"' && { echo "::error::publish failed"; exit 1; }
            sleep 15
          done
          echo "still in progress — check Partner Center"; exit 0
